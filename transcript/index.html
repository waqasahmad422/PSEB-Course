<!DOCTYPE html>
<html>
<head>
    <title>Student Transcript</title>
</head>
<body>
    <header>
        <h1>Student Transcript</h1>
    </header>

    <main>
        <form>
            <h2>Student Information</h2>

            <p>
                <label for="student-name">Student Name:</label>
                <input type="text" id="student-name">
            </p>

            <p>
                <label for="student-id">Student ID:</label>
                <input type="text" id="student-id">
            </p>

            <p>
                <label for="school">School:</label>
                <input type="text" id="school">
            </p>

            <p>
                <label for="semester">Semester:</label>
                <input type="text" id="semester">
            </p>

            <h2>Course Grades</h2>

            <table>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Credits</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><label>Course 1: <input type="text"></label></td>
                        <td><label>Credits: <input type="number"></label></td>
                        <td>
                            <label>Grade:
                                <select>
                                    <option>A</option>
                                    <option>B</option>
                                    <option>C</option>
                                    <option>D</option>
                                    <option>F</option>
                                </select>
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td><label>Course 2: <input type="text"></label></td>
                        <td><label>Credits: <input type="number"></label></td>
                        <td>
                            <label>Grade:
                                <select>
                                    <option>A</option>
                                    <option>B</option>
                                    <option>C</option>
                                    <option>D</option>
                                    <option>F</option>
                                </select>
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td><label>Course 3: <input type="text"></label></td>
                        <td><label>Credits: <input type="number"></label></td>
                        <td>
                            <label>Grade:
                                <select>
                                    <option>A</option>
                                    <option>B</option>
                                    <option>C</option>
                                    <option>D</option>
                                    <option>F</option>
                                </select>
                            </label>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p>
                <label for="gpa">GPA:</label>
                <input type="number" id="gpa">
            </p>
        </form>

    </main>

    <footer>
        <p>&copy; Waqas Ahmad Shah. All Reserved right.</p>
    </footer>
</body>
</html>
