<!doctype html>
<html>
  <head>
    <title>Student Transcript</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <style>
    body{
      background-color: rgb(88, 204, 165);
    }
    fieldset{
      background-color: rgb(169, 218, 221);
    }

  </style>
  <body>
    <header>
      <h1 style="color: rgb(82, 17, 143); text-align: center;">Student Transcript</h1>
    </header>

    <main>
      <form>
        <fieldset>
            <legend style="text-align:center; font-size: 20px; font-weight: bold; color: rgb(179, 9, 9);">Student Information</legend>

          <p>
            <label for="student-name">Student Name:</label>
            <input type="text" id="student-name" placeholder="Name"/>
          </p>

          <p>
            <label for="student-id">Student ID:</label>
            <input type="text" id="student-id" placeholder="Id" />
          </p>

          <p>
            <label for="school">School:</label>
            <input type="text" id="school" placeholder="school name" />
          </p>

          <p>
            <label for="semester">Semester:</label>
            <input type="text" id="semester" placeholder="semster name"/>
          </p>

          <h2>Course Grades</h2>

          <table>
            <thead>
              <tr>
                <th>Course</th>
                <th>Credits</th>
                <th>Grade</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <label>Course 1: <input type="text" placeholder="course name"/></label>
                </td>
                <td>
                  <label>Credits: <input type="number" min="1" placeholder="Hours"/></label>
                </td>
                <td>
                  <label
                    >Grade:
                    <select>
                      <option>A</option>
                      <option>B</option>
                      <option>C</option>
                      <option>D</option>
                      <option>F</option>
                    </select>
                  </label>
                </td>
              </tr>
              <tr>
                <td>
                  <label>Course 2: <input type="text" placeholder="course name"/></label>
                </td>
                <td>
                  <label>Credits: <input type="number" min="1" placeholder="Hours"/></label>
                </td>
                <td>
                  <label
                    >Grade:
                    <select>
                      <option>A</option>
                      <option>B</option>
                      <option>C</option>
                      <option>D</option>
                      <option>F</option>
                    </select>
                  </label>
                </td>
              </tr>
              <tr>
                <td>
                  <label>Course 3: <input type="text" placeholder="course name"/></label>
                </td>
                <td>
                  <label>Credits: <input type="number" min="1" placeholder="Hours"/></label>
                </td>
                <td>
                  <label
                    >Grade:
                    <select>
                      <option>A</option>
                      <option>B</option>
                      <option>C</option>
                      <option>D</option>
                      <option>F</option>
                    </select>
                  </label>
                </td>
              </tr>
            </tbody>
          </table>

          <p>
            <label for="gpa">GPA:</label>
            <input type="number" id="gpa" min="1" max="4" placeholder="Enter GPA"/>
          </p>

          <button type="submit" class="btn">Submit</button>
        </fieldset>
      </form>
    </main>

    <footer style="text-align: center;">
      <p>&copy; Waqas Ahmad Shah. All Reserved right.</p>
    </footer>
  </body>
</html>
